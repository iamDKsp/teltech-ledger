kind = "web"
previewPath = "/"
title = "Teltech Ledger"
version = "1.0.0"
id = "artifacts/teltech-ledger"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22694

[services.development]
run = "pnpm --filter @workspace/teltech-ledger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teltech-ledger", "run", "build" ]
publicDir = "artifacts/teltech-ledger/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22694"
BASE_PATH = "/"
