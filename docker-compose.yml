services:
  db:
    image: postgres:16-alpine
    container_name: teltech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teltech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teltech_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-teltech_ledger}
    volumes:
      - teltech_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-teltech} -d $${POSTGRES_DB:-teltech_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - teltech-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: teltech-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-teltech}:${POSTGRES_PASSWORD:-teltech_secure_password_2026}@db:5432/${POSTGRES_DB:-teltech_ledger}
      JWT_SECRET: ${JWT_SECRET:-teltech-leadge-prod-secret-2026}
    volumes:
      - teltech_uploads:/app/public/uploads
    networks:
      - teltech-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: teltech-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - teltech-network

volumes:
  teltech_postgres_data:
    name: teltech_postgres_data
  teltech_uploads:
    name: teltech_uploads

networks:
  teltech-network:
    name: teltech-network
    driver: bridge
